name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 cryptography argon2-cffi

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name YukiCrypt
          --icon NONE
          app.py

      - name: Upload exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YukiCrypt.exe
